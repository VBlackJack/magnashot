    See the License for the specific language governing permissions and
    limitations under the License.
  -->
  <defs>
    <radialGradient id="northPole" cx="0.32" cy="0.28" r="0.82">
      <stop offset="0" stop-color="#f0f9ff" />
      <stop offset="0.28" stop-color="#38bdf8" />
      <stop offset="0.72" stop-color="#0284c7" />
      <stop offset="1" stop-color="#172554" />
    </radialGradient>
    <radialGradient id="southPole" cx="0.68" cy="0.72" r="0.86">
      <stop offset="0" stop-color="#f5d0fe" />
      <stop offset="0.26" stop-color="#c084fc" />
      <stop offset="0.68" stop-color="#9333ea" />
      <stop offset="1" stop-color="#3b0764" />
    </radialGradient>
    <linearGradient id="fluxBack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="0.5" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="1" stop-color="#c084fc" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="fluxFront" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="0.5" stop-color="#f8fafc" />
      <stop offset="1" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="seamGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bae6fd" />
      <stop offset="0.5" stop-color="#ffffff" />
      <stop offset="1" stop-color="#e9d5ff" />
    </linearGradient>
    <radialGradient id="nodeCyan" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.45" stop-color="#38bdf8" />
      <stop offset="1" stop-color="#0369a1" />
    </radialGradient>
    <radialGradient id="nodeViolet" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.45" stop-color="#e879f9" />
      <stop offset="1" stop-color="#7e22ce" />
    </radialGradient>
    <clipPath id="sphereClip">
      <circle cx="256" cy="256" r="132" />
    </clipPath>
    <clipPath id="frontRingClip">
      <rect x="-40" y="256" width="592" height="296" />
    </clipPath>
  </defs>

  <!-- Outer dashed dipole trajectory loop -->
  <g transform="rotate(-28 256 256)">
    <ellipse cx="256" cy="256" rx="224" ry="96" fill="none" stroke="url(#fluxBack)" stroke-width="7" stroke-dasharray="22 14" stroke-linecap="round" opacity="0.78" />
    <!-- Back half of primary orbital ring -->
    <ellipse cx="256" cy="256" rx="210" ry="34" fill="none" stroke="url(#fluxBack)" stroke-width="14" />
  </g>

  <!-- Dipole sphere core -->
  <g clip-path="url(#sphereClip)">
    <circle cx="256" cy="256" r="134" fill="url(#northPole)" />
    <g transform="rotate(-28 256 256)">
      <path d="M 96 256 C 176 226, 214 238, 256 256 C 298 274, 336 286, 416 256 L 416 420 L 96 420 Z" fill="url(#southPole)" />
      <path d="M 96 256 C 176 226, 214 238, 256 256 C 298 274, 336 286, 416 256" fill="none" stroke="#bae6fd" stroke-width="14" opacity="0.38" />
      <path d="M 96 256 C 176 226, 214 238, 256 256 C 298 274, 336 286, 416 256" fill="none" stroke="url(#seamGlow)" stroke-width="5" stroke-linecap="round" />
    </g>
    <!-- Specular crescent highlight -->
    <ellipse cx="204" cy="186" rx="46" ry="24" transform="rotate(-32 204 186)" fill="#ffffff" opacity="0.22" />
  </g>
  <!-- Crisp outer sphere rim -->
  <circle cx="256" cy="256" r="132" fill="none" stroke="#f8fafc" stroke-width="4" opacity="0.24" />

  <!-- Upright polarity glyphs (+ north cyan, - south violet) -->
  <g stroke-linecap="round" fill="none">
    <path d="M 224 182 V 214 M 208 198 H 240" stroke="#070b14" stroke-width="20" opacity="0.34" />
    <path d="M 224 182 V 214 M 208 198 H 240" stroke="#f8fafc" stroke-width="12" />
    <path d="M 274 326 H 312" stroke="#070b14" stroke-width="20" opacity="0.34" />
    <path d="M 274 326 H 312" stroke="#f8fafc" stroke-width="12" />
  </g>

  <!-- Front orbital ring + orbiting charge nodes -->
  <g transform="rotate(-28 256 256)">
    <g clip-path="url(#frontRingClip)">
      <ellipse cx="256" cy="256" rx="210" ry="34" fill="none" stroke="url(#fluxFront)" stroke-width="15" stroke-linecap="round" />
    </g>
    <circle cx="456" cy="246" r="15" fill="url(#nodeCyan)" stroke="#f8fafc" stroke-width="2.5" />
    <circle cx="56" cy="266" r="14" fill="url(#nodeViolet)" stroke="#f8fafc" stroke-width="2.5" />
  </g>
</svg>
