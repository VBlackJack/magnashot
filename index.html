<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" data-i18n-content="app.header.subtitle.description" content="Magnetic physics bubble shooter game with dynamic attraction, rotors, and special spheres." />
  <title data-i18n="app.header.title.main">MAGNASHOT</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Slide-in burger menu (see .app-shell.drawer-open). -->
    <header id="app-drawer" class="top-bar" data-i18n-aria-label="app.drawer.aria.label">
      <div class="drawer-head">
        <div class="brand-group">
          <h1 class="brand-title" data-i18n="app.header.title.main"></h1>
          <span class="brand-subtitle" data-i18n="app.header.subtitle.edition"></span>
        </div>
        <button id="btn-close-drawer" type="button" class="drawer-close-btn" data-i18n-aria-label="app.drawer.button.closeAria" data-i18n-title="app.drawer.button.closeAria"><span aria-hidden="true">✕</span></button>
      </div>
      <dl class="drawer-stats">
        <div class="drawer-stat drawer-stat-wide">
          <dt class="visually-hidden" data-i18n="app.drawer.stats.round"></dt>
          <dd id="drawer-mode" class="drawer-mode"></dd>
          <dd id="drawer-star-progress" class="drawer-star-progress gold-text"></dd>
        </div>
        <div class="drawer-stat">
          <dt data-i18n="hud.stats.coins.label"></dt>
          <dd id="drawer-coins" class="gold-text"></dd>
        </div>
        <div class="drawer-stat">
          <dt data-i18n="hud.stats.highScore.label"></dt>
          <dd id="drawer-best"></dd>
        </div>
        <div class="drawer-stat">
          <dt data-i18n="hud.stats.overcharge.label"></dt>
          <dd id="drawer-overcharge"></dd>
        </div>
        <div id="drawer-perks-stat" class="drawer-stat drawer-stat-wide hidden">
          <dt data-i18n="hud.stats.perks.label"></dt>
          <dd id="drawer-perks" class="perk-chips"></dd>
        </div>
      </dl>
      <button id="btn-stats" type="button" data-closes-drawer class="nav-btn stats-btn" aria-haspopup="dialog" data-i18n="app.drawer.button.stats"></button>
      <nav class="nav-controls">
        <div class="nav-group nav-modes" role="group" aria-labelledby="nav-group-modes-title">
          <span id="nav-group-modes-title" class="nav-group-title" data-i18n="app.nav.groups.modes"></span>
          <button id="btn-levels" type="button" data-closes-drawer class="nav-btn mode-btn" data-i18n="app.nav.button.levels"></button>
          <button id="btn-endless" type="button" data-closes-drawer class="nav-btn mode-btn" data-i18n="app.nav.button.endless"></button>
          <button id="btn-daily" type="button" data-closes-drawer class="nav-btn mode-btn" data-i18n="app.nav.button.daily"></button>
          <button id="btn-flux" type="button" data-closes-drawer class="nav-btn mode-btn" data-i18n="app.nav.button.flux"></button>
          <button id="btn-weekly" type="button" data-closes-drawer class="nav-btn mode-btn" data-i18n="app.nav.button.weekly"></button>
          <p id="nav-mode-lock-hint" class="nav-lock-hint hidden" role="status" aria-live="polite"></p>
        </div>
        <div class="nav-group nav-actions" role="group" aria-labelledby="nav-group-round-title">
          <span id="nav-group-round-title" class="nav-group-title" data-i18n="app.nav.groups.round"></span>
          <button id="btn-pause" type="button" data-closes-drawer class="nav-btn primary" data-i18n="app.nav.button.pause" data-i18n-title="app.nav.button.pauseTooltip"></button>
          <button id="btn-restart" type="button" data-closes-drawer class="nav-btn" data-i18n="app.nav.button.restart"></button>
          <button id="btn-shop" type="button" data-closes-drawer class="nav-btn gold" data-i18n="app.nav.button.shop"></button>
          <button id="btn-settings" type="button" data-closes-drawer class="nav-btn settings-btn" aria-haspopup="dialog"><span class="settings-btn-icon" aria-hidden="true" data-i18n="app.nav.button.settingsIcon"></span> <span data-i18n="app.nav.button.settings"></span></button>
        </div>
      </nav>
    </header>

    <div id="drawer-backdrop" class="drawer-backdrop" aria-hidden="true"></div>

    <section class="hud-bar">
      <button id="btn-menu" type="button" class="hud-menu-btn" aria-controls="app-drawer" aria-expanded="false" data-i18n-aria-label="app.drawer.button.openAria" data-i18n-title="app.drawer.button.openAria"><span aria-hidden="true">☰</span></button>
      <div class="hud-stat-box hud-stat-score">
        <span class="hud-label" data-i18n="hud.stats.score.label"></span>
        <span id="hud-score-value" class="hud-value"></span>
        <span id="hud-star-progress" class="hud-subvalue gold-text"><span id="hud-star-glyphs" class="hud-subvalue-part" aria-hidden="true"></span><span id="hud-star-count" class="visually-hidden"></span> <span id="hud-star-next" class="hud-subvalue-part"></span><span id="hud-star-meter" class="star-meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" data-i18n-aria-label="hud.stats.score.progressAria"><span id="hud-star-meter-fill" class="star-meter-fill"></span></span></span>
      </div>
      <div class="hud-center-info">
        <div class="hud-mode-row">
          <div id="hud-mode-banner" class="hud-mode-banner" role="button" tabindex="0" aria-haspopup="dialog"></div>
          <button id="btn-hint-replay" type="button" class="hud-menu-btn hud-hint-btn hidden" data-i18n-aria-label="hud.hints.replayAria" data-i18n-title="hud.hints.replayAria"><span aria-hidden="true">?</span></button>
        </div>
        <div class="hud-badges-row">
          <span id="hud-combo-badge" class="hud-badge combo hidden"></span>
          <span id="hud-frozen-badge" class="hud-badge frozen hidden"></span>
          <span id="hud-best-run" class="hud-badge best-run hidden"></span>
          <span id="hud-ghost" class="hud-badge ghost hidden" role="group"></span>
          <span id="hud-perks" class="perk-chips hidden" role="group" data-i18n-aria-label="hud.stats.perks.label"></span>
        </div>
      </div>
      <div class="hud-stat-box hud-stat-shots">
        <span id="hud-shots-label" class="hud-label" data-i18n="hud.stats.shots.label"></span>
        <span id="hud-shots-value" class="hud-value highlight"></span>
        <span id="hud-sag-meter" class="sag-meter hidden" role="meter" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" aria-valuetext="" data-i18n-aria-label="hud.stats.sag.label"><span id="hud-sag-meter-fill" class="sag-meter-fill"></span></span>
      </div>
      <div class="hud-stat-box hud-stat-coins">
        <span class="hud-label" data-i18n="hud.stats.coins.label"></span>
        <span id="hud-coins-value" class="hud-value gold-text"></span>
      </div>
      <div class="hud-stat-box hud-stat-best">
        <span class="hud-label" data-i18n="hud.stats.highScore.label"></span>
        <span id="hud-best-value" class="hud-value"></span>
      </div>
      <button id="btn-fullscreen-hud" type="button" class="hud-menu-btn hud-fullscreen-btn"></button>
      <p id="hud-compact-info" class="hud-compact-info"></p>
    </section>

    <main class="stage-container">
      <div class="stage-column">
        <div class="canvas-area">
          <div class="canvas-wrapper">
            <canvas id="game-canvas" role="application" tabindex="0"></canvas>
            <div id="tutorial-banner" class="tutorial-banner hidden" aria-live="polite">
              <span id="tutorial-banner-text"></span>
              <button id="btn-dismiss-tutorial" type="button" class="tutorial-dismiss-btn"><span aria-hidden="true">✕</span></button>
            </div>
            <div id="level-intro-banner" class="level-intro-banner hidden">
              <span id="level-intro-text"></span>
              <button id="btn-dismiss-level-intro" type="button" class="tutorial-dismiss-btn" data-i18n-aria-label="hud.levelIntro.dismiss"><span aria-hidden="true">✕</span></button>
            </div>
            <div id="special-equipped-banner" class="special-equipped-banner hidden" aria-live="polite"></div>
            <div id="cancel-aim-banner" class="cancel-aim-banner hidden" data-i18n="hud.launcher.cancel.hint"></div>
          </div>
        </div>
        <div class="launcher-controls-dock">
          <button id="btn-polarity" type="button" class="polarity-floating-btn"><span class="launcher-icon" aria-hidden="true"></span> <span class="launcher-text"></span><span class="launcher-caption" aria-hidden="true"></span><span class="pad-glyph pad-face" data-pos="top" aria-hidden="true"></span></button>
          <button id="btn-swap-ball" type="button" class="swap-floating-btn"><span class="launcher-icon" aria-hidden="true"></span> <span class="launcher-text"></span><span class="launcher-caption" aria-hidden="true"></span><span class="pad-glyph pad-face" data-pos="left" aria-hidden="true"></span></button>
        </div>
      </div>

      <aside class="powerups-panel">
        <div class="overcharge-widget">
          <div class="overcharge-header">
            <span data-i18n="hud.stats.overcharge.label"></span>
            <span id="hud-overcharge-pct"></span>
          </div>
          <div class="overcharge-track">
            <div id="hud-overcharge-fill" class="overcharge-fill"></div>
          </div>
        </div>
        <div id="powerups-header" class="powerups-header" data-i18n="hud.powerups.title.label"></div>
        <div id="powerups-bar" class="powerups-bar"></div>
        <p id="powerups-empty" class="powerups-empty hidden" data-i18n="hud.powerups.empty"></p>
      </aside>
    </main>
  </div>

  <div id="sr-announcer" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="toast" class="toast hidden" aria-hidden="true"></div>

  <!-- Level Select Modal -->
  <div id="modal-levels" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-levels-title">
    <div class="modal-card wide">
      <h2 id="modal-levels-title" class="modal-title" data-i18n="modals.levelSelect.title.main"></h2>
      <div class="arcade-modes-section">
        <div class="arcade-modes-header" data-i18n="modals.levelSelect.arcade.sectionTitle"></div>
        <div class="arcade-modes-strip">
          <button id="btn-mode-classic" type="button" class="arcade-mode-card">
            <span class="arcade-card-title" data-i18n="modals.levelSelect.arcade.classic"></span>
            <span class="arcade-card-desc" data-i18n="modals.levelSelect.arcade.classicDesc"></span>
            <span id="arcade-best-classic" class="arcade-card-best gold-text"></span>
          </button>
          <button id="btn-mode-puzzle" type="button" class="arcade-mode-card">
            <span class="arcade-card-title" data-i18n="modals.levelSelect.arcade.puzzle"></span>
            <span class="arcade-card-desc" data-i18n="modals.levelSelect.arcade.puzzleDesc"></span>
            <span id="arcade-best-puzzle" class="arcade-card-best gold-text"></span>
          </button>
          <button id="btn-mode-blitz" type="button" class="arcade-mode-card">
            <span class="arcade-card-title" data-i18n="modals.levelSelect.arcade.blitz"></span>
            <span class="arcade-card-desc" data-i18n="modals.levelSelect.arcade.blitzDesc"></span>
            <span id="arcade-best-blitz" class="arcade-card-best gold-text"></span>
          </button>
          <button id="btn-mode-boss-rush" type="button" class="arcade-mode-card">
            <span class="arcade-card-title" data-i18n="modals.levelSelect.arcade.bossRush"></span>
            <span class="arcade-card-desc" data-i18n="modals.levelSelect.arcade.bossRushDesc"></span>
            <span id="arcade-best-boss-rush" class="arcade-card-best gold-text"></span>
          </button>
          <button id="btn-mode-cascade" type="button" class="arcade-mode-card">
            <span class="arcade-card-title" data-i18n="modals.levelSelect.arcade.cascade"></span>
            <span class="arcade-card-desc" data-i18n="modals.levelSelect.arcade.cascadeDesc"></span>
            <span id="arcade-best-cascade" class="arcade-card-best gold-text"></span>
          </button>
        </div>
        <div id="puzzle-stages-strip" class="puzzle-stages-strip"></div>
      </div>
      <div class="levels-toolbar">
        <p id="levels-stars-summary" class="modal-stat-line gold-text"></p>
        <div class="levels-toolbar-actions">
          <button id="btn-levels-filter-incomplete" type="button" class="nav-btn badge-btn" aria-pressed="false" data-i18n="modals.levelSelect.filter.incomplete"></button>
          <div class="flux-seed-entry">
            <input id="input-flux-seed" type="text" class="flux-seed-input" autocomplete="off" spellcheck="false" data-i18n-placeholder="modals.levelSelect.fluxSeed.placeholder" data-i18n-aria-label="modals.levelSelect.fluxSeed.ariaLabel">
            <button id="btn-flux-seed-go" type="button" class="nav-btn badge-btn" data-i18n="modals.levelSelect.fluxSeed.launch"></button>
          </div>
        </div>
      </div>
      <div id="levels-chapters" class="level-chapters" role="tablist" data-i18n-aria-label="modals.levelSelect.chapters.label"></div>
      <p id="levels-chapter-hint" class="modal-subtext hidden" role="status" aria-live="polite"></p>
      <div id="levels-grid" class="levels-grid" role="tabpanel"></div>
      <div class="modal-actions">
        <button id="btn-play-level-modal" type="button" class="modal-btn primary"></button>
        <button id="btn-close-levels" type="button" class="modal-btn" data-i18n="modals.levelSelect.button.close"></button>
      </div>
    </div>
  </div>

  <!-- Shop Modal -->
  <div id="modal-shop" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-shop-title">
    <div class="modal-card wide">
      <h2 id="modal-shop-title" class="modal-title gold-text" data-i18n="modals.shop.title.main"></h2>
      <p id="shop-balance" class="modal-stat-line gold-text"></p>
      <div class="modal-tabs" role="tablist">
        <button id="tab-shop-upgrades" type="button" class="modal-tab active" role="tab" aria-selected="true" aria-controls="shop-upgrades-pane" tabindex="0" data-i18n="modals.shop.tabs.upgrades"></button>
        <button id="tab-shop-ammo" type="button" class="modal-tab" role="tab" aria-selected="false" aria-controls="shop-ammo-pane" tabindex="-1" data-i18n="modals.shop.tabs.ammo"></button>
        <button id="tab-shop-styles" type="button" class="modal-tab" role="tab" aria-selected="false" aria-controls="shop-styles-pane" tabindex="-1" data-i18n="modals.shop.tabs.styles"></button>
        <button id="tab-shop-achievements" type="button" class="modal-tab" role="tab" aria-selected="false" aria-controls="achievements-grid" tabindex="-1"></button>
        <button id="tab-shop-codex" type="button" class="modal-tab" role="tab" aria-selected="false" aria-controls="codex-pane" tabindex="-1" data-i18n="modals.shop.tabs.codex"></button>
      </div>
      <div id="shop-upgrades-pane" class="shop-pane" role="tabpanel" aria-labelledby="tab-shop-upgrades">
        <div id="shop-grid" class="levels-grid"></div>
      </div>
      <div id="shop-ammo-pane" class="shop-pane hidden" role="tabpanel" aria-labelledby="tab-shop-ammo">
        <h3 class="modal-subtitle" data-i18n="modals.shop.specialAmmo.title"></h3>
        <div id="shop-ammo-grid" class="ammo-shop-grid"></div>
      </div>
      <div id="shop-styles-pane" class="shop-pane hidden" role="tabpanel" aria-labelledby="tab-shop-styles">
        <div id="shop-styles-grid" class="levels-grid"></div>
      </div>
      <div id="achievements-grid" class="levels-grid hidden" role="tabpanel" aria-labelledby="tab-shop-achievements"></div>
      <div id="codex-pane" class="codex-pane hidden" role="tabpanel" aria-labelledby="tab-shop-codex"></div>
      <div class="modal-actions">
        <button id="btn-close-shop" type="button" class="modal-btn" data-i18n="modals.shop.button.close"></button>
      </div>
    </div>
  </div>

  <!-- Victory Modal -->
  <div id="modal-victory" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-victory-title">
    <div class="modal-card">
      <h2 id="modal-victory-title" class="modal-title victory-title" data-i18n="modals.victory.title.main"></h2>
      <div id="victory-stars" class="victory-stars-banner"></div>
      <p id="victory-next-star" class="modal-subtext hidden"></p>
      <p id="victory-unlock" class="modal-subtext hidden"></p>
      <p id="victory-score" class="modal-stat-line"></p>
      <p id="victory-bonus" class="modal-stat-line muted"></p>
      <div class="modal-actions">
        <button id="btn-next-level" type="button" class="modal-btn primary" data-i18n="modals.victory.button.nextLevel"></button>
        <button id="btn-replay-victory" type="button" class="modal-btn" data-i18n="modals.victory.button.replay"></button>
        <button id="btn-levels-victory" type="button" class="modal-btn" data-i18n="modals.victory.button.levels"></button>
      </div>
    </div>
  </div>

  <!-- Game Over Modal -->
  <div id="modal-gameover" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-gameover-title">
    <div class="modal-card">
      <h2 id="modal-gameover-title" class="modal-title danger-title" data-i18n="modals.gameOver.title.main"></h2>
      <p id="gameover-reason" class="modal-stat-line muted"></p>
      <p id="gameover-score" class="modal-stat-line"></p>
      <p id="gameover-best" class="modal-stat-line"></p>
      <p id="gameover-remaining" class="modal-subtext hidden"></p>
      <p id="gameover-stage" class="modal-stat-line hidden"></p>
      <p id="gameover-near-miss" class="modal-stat-line muted near-miss hidden"></p>
      <p id="gameover-duel" class="modal-stat-line duel-result hidden"></p>
      <p id="gameover-daily-next" class="modal-stat-line muted hidden"></p>
      <div class="modal-actions">
        <button id="btn-continue-gameover" type="button" class="modal-btn primary hidden"></button>
        <button id="btn-retry" type="button" class="modal-btn primary" data-i18n="modals.gameOver.button.retry"></button>
        <button id="btn-same-seed-gameover" type="button" class="modal-btn hidden"></button>
        <button id="btn-levels-gameover" type="button" class="modal-btn" data-i18n="modals.gameOver.button.levels"></button>
        <button id="btn-share-gameover" type="button" class="modal-btn hidden" data-i18n="modals.gameOver.button.share"></button>
        <button id="btn-daily-history-gameover" type="button" class="modal-btn hidden" aria-haspopup="dialog" data-i18n="modals.gameOver.button.dailyHistory"></button>
      </div>
      <label id="gameover-share-fallback" class="share-fallback hidden">
        <span class="share-fallback-label" data-i18n="modals.gameOver.share.field.label"></span>
        <textarea id="gameover-share-text" class="share-fallback-text" readonly></textarea>
      </label>
    </div>
  </div>

  <!-- Pause Modal -->
  <div id="modal-pause" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-pause-title">
    <div class="modal-card">
      <h2 id="modal-pause-title" class="modal-title" data-i18n="modals.pause.title.main"></h2>
      <p id="pause-level-tip" class="pause-level-tip hidden"></p>
      <ul class="instructions-list">
        <li id="pause-instruction-aim" class="key-hint"></li>
        <li id="pause-instruction-swap" class="key-hint"></li>
        <li id="pause-instruction-cancel" class="key-hint"></li>
        <li id="pause-instruction-keyboard" class="key-hint"></li>
        <li id="pause-instruction-pad" class="pad-only">
          <span data-i18n="modals.pause.instructions.pad"></span>
          <span class="pad-glyphs"><span class="pad-glyph pad-face" data-pos="bottom" aria-hidden="true"></span><span class="pad-glyph pad-face" data-pos="left" aria-hidden="true"></span><span class="pad-glyph pad-face" data-pos="top" aria-hidden="true"></span><span class="pad-glyph pad-bumper" data-i18n="hud.pad.glyph.leftBumper" aria-hidden="true"></span><span class="pad-glyph pad-bumper" data-i18n="hud.pad.glyph.rightBumper" aria-hidden="true"></span><span class="pad-glyph pad-trigger" data-i18n="hud.pad.glyph.rightTrigger" aria-hidden="true"></span><span class="pad-glyph pad-pill" data-i18n="hud.pad.glyph.start" aria-hidden="true"></span></span>
        </li>
        <li data-i18n="modals.pause.instructions.physics"></li>
      </ul>
      <div class="modal-actions">
        <button id="btn-resume" type="button" class="modal-btn primary" data-i18n="modals.pause.button.resume"></button>
        <button id="btn-restart-pause" type="button" class="modal-btn" data-i18n="modals.pause.button.restart"></button>
        <button id="btn-levels-pause" type="button" class="modal-btn" data-i18n="modals.pause.button.levels"></button>
        <button id="btn-settings-pause" type="button" class="modal-btn" aria-haspopup="dialog"><span class="settings-btn-icon" aria-hidden="true" data-i18n="app.nav.button.settingsIcon"></span> <span data-i18n="app.nav.button.settings"></span></button>
      </div>
    </div>
  </div>

  <!-- Flux Perk Modal: no close button, the choice is part of the run -->
  <div id="modal-flux-perk" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-flux-perk-title" aria-describedby="modal-flux-perk-subtitle">
    <div class="modal-card">
      <h2 id="modal-flux-perk-title" class="modal-title" data-i18n="modals.fluxPerk.title"></h2>
      <p id="modal-flux-perk-subtitle" class="modal-subtext"></p>
      <div id="flux-perk-cards" class="flux-perk-cards"></div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="modal-settings" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-settings-title">
    <div class="modal-card">
      <h2 id="modal-settings-title" class="modal-title" data-i18n="modals.settings.title.main"></h2>
      <div class="pause-settings-row">
        <div class="pause-setting">
          <button id="btn-sound" type="button" class="nav-btn icon-btn"></button>
          <span class="pause-setting-caption" data-caption-for="btn-sound" aria-hidden="true"></span>
        </div>
        <div class="pause-setting">
          <button id="btn-contrast" type="button" class="nav-btn icon-btn"></button>
          <span class="pause-setting-caption" data-caption-for="btn-contrast" aria-hidden="true"></span>
        </div>
        <div class="pause-setting">
          <button id="btn-patterns" type="button" class="nav-btn icon-btn"></button>
          <span class="pause-setting-caption" data-caption-for="btn-patterns" aria-hidden="true"></span>
        </div>
        <div class="pause-setting">
          <button id="btn-tilt" type="button" class="nav-btn icon-btn"></button>
          <span class="pause-setting-caption" data-caption-for="btn-tilt" aria-hidden="true"></span>
        </div>
        <div class="pause-setting">
          <button id="btn-motion" type="button" class="nav-btn icon-btn"></button>
          <span class="pause-setting-caption" data-caption-for="btn-motion" aria-hidden="true"></span>
        </div>
        <div class="pause-setting">
          <button id="btn-anim-speed" type="button" class="nav-btn badge-btn"></button>
          <span class="pause-setting-caption" data-caption-for="btn-anim-speed" aria-hidden="true"></span>
        </div>
        <div class="pause-setting">
          <button id="btn-fullscreen" type="button" class="nav-btn icon-btn"></button>
          <span class="pause-setting-caption" data-caption-for="btn-fullscreen" aria-hidden="true"></span>
        </div>
        <div class="pause-setting">
          <button id="btn-reset-hints" type="button" class="nav-btn icon-btn" data-i18n="app.nav.button.resetHints" data-i18n-aria-label="app.nav.button.resetHintsAria" data-i18n-title="app.nav.button.resetHintsAria"></button>
          <span class="pause-setting-caption" data-i18n="app.nav.button.resetHintsCaption" data-caption-for="btn-reset-hints" aria-hidden="true"></span>
        </div>
        <div class="pause-setting">
          <button id="btn-lang" type="button" class="nav-btn badge-btn"></button>
          <span class="pause-setting-caption" data-i18n="app.nav.button.languageCaption" aria-hidden="true"></span>
        </div>
      </div>
      <div class="settings-duel-name">
        <label id="duel-name-label" class="settings-duel-name-label" for="input-duel-name" data-i18n="modals.settings.duelName.label"></label>
        <input id="input-duel-name" type="text" class="flux-seed-input settings-duel-name-input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="duel-name-hint">
        <p id="duel-name-hint" class="install-hint" data-i18n="modals.settings.duelName.hint"></p>
      </div>
      <section class="settings-controller" aria-labelledby="settings-controller-title">
        <h3 id="settings-controller-title" class="stats-section-title" data-i18n="modals.settings.controller.title"></h3>
        <p id="settings-controller-hint" class="install-hint" data-i18n="modals.settings.controller.hint"></p>
        <span class="pad-glyphs"><span class="pad-glyph pad-face" data-pos="bottom" aria-hidden="true"></span><span class="pad-glyph pad-bumper" data-i18n="hud.pad.glyph.leftBumper" aria-hidden="true"></span><span class="pad-glyph pad-bumper" data-i18n="hud.pad.glyph.rightBumper" aria-hidden="true"></span><span class="pad-glyph pad-pill" data-i18n="hud.pad.glyph.start" aria-hidden="true"></span><span class="pad-glyph pad-pill" data-i18n="hud.pad.glyph.select" aria-hidden="true"></span></span>
        <label class="settings-controller-field">
          <input id="input-gamepad-enabled" type="checkbox">
          <span data-i18n="modals.settings.controller.enabled"></span>
        </label>
        <label class="settings-controller-field" for="select-gamepad-deadzone">
          <span data-i18n="modals.settings.controller.deadzone"></span>
          <select id="select-gamepad-deadzone" class="flux-seed-input settings-controller-select"></select>
        </label>
        <label class="settings-controller-field" for="select-gamepad-aim-speed">
          <span data-i18n="modals.settings.controller.aimSpeed"></span>
          <select id="select-gamepad-aim-speed" class="flux-seed-input settings-controller-select"></select>
        </label>
        <label class="settings-controller-field">
          <input id="input-gamepad-invert-x" type="checkbox">
          <span data-i18n="modals.settings.controller.invertX"></span>
        </label>
      </section>
      <div class="settings-install-row">
        <button id="btn-install" type="button" class="modal-btn hidden" data-i18n="modals.settings.install.button"></button>
        <p id="install-ios-hint" class="install-hint hidden" data-i18n="modals.settings.install.iosHint"></p>
      </div>
      <div class="modal-actions">
        <button id="btn-close-settings" type="button" class="modal-btn primary" data-i18n="modals.settings.button.close"></button>
      </div>
    </div>
  </div>

  <!-- Stats Modal -->
  <div id="modal-stats" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-stats-title">
    <div class="modal-card wide">
      <h2 id="modal-stats-title" class="modal-title" data-i18n="modals.stats.title.main"></h2>
      <div class="modal-tabs" role="tablist">
        <button id="tab-stats-overview" type="button" class="modal-tab active" role="tab" aria-selected="true" aria-controls="stats-overview-pane" tabindex="0" data-i18n="modals.stats.tabs.overview"></button>
        <button id="tab-stats-daily" type="button" class="modal-tab" role="tab" aria-selected="false" aria-controls="stats-daily-pane" tabindex="-1" data-i18n="modals.stats.tabs.daily"></button>
      </div>
      <div id="stats-overview-pane" class="stats-pane" role="tabpanel" aria-labelledby="tab-stats-overview">
        <p id="stats-since" class="modal-subtext hidden"></p>
        <p id="stats-overview-empty" class="modal-subtext hidden" data-i18n="modals.stats.overview.empty"></p>
        <dl id="stats-overview-list" class="stats-list"></dl>
        <ul id="stats-campaign-list" class="stats-campaign-list"></ul>
        <section id="stats-duels" class="stats-duels" aria-labelledby="stats-duels-title">
          <h3 id="stats-duels-title" class="stats-section-title" data-i18n="modals.stats.duels.title"></h3>
          <p id="stats-duels-record" class="modal-subtext hidden"></p>
          <p id="stats-duels-empty" class="modal-subtext hidden" data-i18n="modals.stats.duels.empty"></p>
          <ul id="stats-duels-list" class="stats-campaign-list hidden"></ul>
        </section>
        <p class="modal-subtext" data-i18n="modals.stats.overview.privacy"></p>
      </div>
      <div id="stats-daily-pane" class="stats-pane hidden" role="tabpanel" aria-labelledby="tab-stats-daily">
        <p id="stats-daily-summary" class="modal-subtext hidden"></p>
        <p id="stats-daily-empty" class="modal-subtext hidden" data-i18n="modals.stats.daily.empty"></p>
        <div id="stats-daily-wrap" class="stats-table-wrap">
          <table class="stats-table" role="table">
            <caption id="stats-daily-caption"></caption>
            <thead role="rowgroup">
              <tr role="row">
                <th scope="col" role="columnheader" data-i18n="modals.stats.daily.col.date"></th>
                <th scope="col" role="columnheader" data-i18n="modals.stats.daily.col.challenge"></th>
                <th scope="col" role="columnheader" data-i18n="modals.stats.daily.col.mutator"></th>
                <th scope="col" role="columnheader" data-i18n="modals.stats.daily.col.score"></th>
                <th scope="col" role="columnheader" data-i18n="modals.stats.daily.col.wave"></th>
                <th scope="col" role="columnheader" data-i18n="modals.stats.daily.col.streak"></th>
              </tr>
            </thead>
            <tbody id="stats-daily-body" role="rowgroup"></tbody>
          </table>
        </div>
      </div>
      <p id="stats-copy-feedback" class="modal-subtext hidden" role="status" aria-live="polite"></p>
      <label id="stats-copy-fallback" class="share-fallback hidden">
        <span class="share-fallback-label" data-i18n="modals.stats.copy.fieldLabel"></span>
        <textarea id="stats-copy-text" class="share-fallback-text" readonly></textarea>
      </label>
      <div class="modal-actions">
        <button id="btn-copy-stats" type="button" class="modal-btn primary" data-i18n="modals.stats.button.copy"></button>
        <button id="btn-close-stats" type="button" class="modal-btn" data-i18n="modals.stats.button.close"></button>
      </div>
    </div>
  </div>

  <!-- Ghost Duel card: a challenge link, or why it cannot be played -->
  <div id="modal-duel" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-duel-title" aria-describedby="duel-card-summary">
    <div class="modal-card">
      <h2 id="modal-duel-title" class="modal-title" data-i18n="duel.card.title"></h2>
      <p id="duel-card-summary" class="modal-stat-line"></p>
      <ul id="duel-card-notes" class="duel-card-notes hidden"></ul>
      <div class="modal-actions">
        <button id="btn-duel-accept" type="button" class="modal-btn primary" data-i18n="duel.card.accept"></button>
        <button id="btn-duel-decline" type="button" class="modal-btn" data-i18n="duel.card.decline"></button>
        <button id="btn-duel-ok" type="button" class="modal-btn primary hidden" data-i18n="duel.error.ok"></button>
      </div>
    </div>
  </div>

  <!-- Confirm Action Modal -->
  <div id="modal-confirm" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-confirm-title">
    <div class="modal-card">
      <h2 id="modal-confirm-title" class="modal-title" data-i18n="modals.confirm.title.main"></h2>
      <p id="modal-confirm-message" class="modal-stat-line muted" data-i18n="modals.confirm.message"></p>
      <div class="modal-actions">
        <button id="btn-confirm-yes" type="button" class="modal-btn danger" data-i18n="modals.confirm.button.confirm"></button>
        <button id="btn-confirm-no" type="button" class="modal-btn primary" data-i18n="modals.confirm.button.cancel"></button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>

  <!-- Bootstrap error banner: static bilingual text because i18n may be the failing part -->
  <div id="bootstrap-error" class="bootstrap-error hidden" role="alert">
    <strong class="bootstrap-error-title">Erreur de chargement / Loading error</strong>
    <p class="bootstrap-error-message" lang="fr">Une erreur empêche le jeu de fonctionner. Veuillez rafraîchir la page.</p>
    <p class="bootstrap-error-message" lang="en">An error prevents the game from running. Please refresh the page.</p>
  </div>
</body>
</html>
