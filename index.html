<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" data-i18n-content="app.header.subtitle.description" content="Magnetic physics bubble shooter game with dynamic attraction, rotors, and special spheres." />
  <title data-i18n="app.header.title.main">MAGNASHOT</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles/main.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Slide-in burger menu (see .app-shell.drawer-open). -->
    <header id="app-drawer" class="top-bar" data-i18n-aria-label="app.drawer.aria.label">
      <div class="drawer-head">
        <div class="brand-group">
          <h1 class="brand-title" data-i18n="app.header.title.main"></h1>
          <span class="brand-subtitle" data-i18n="app.header.subtitle.edition"></span>
        </div>
        <button id="btn-close-drawer" type="button" class="drawer-close-btn" data-i18n-aria-label="app.drawer.button.closeAria" data-i18n-title="app.drawer.button.closeAria"><span aria-hidden="true">✕</span></button>
      </div>
      <dl class="drawer-stats">
        <div class="drawer-stat drawer-stat-wide">
          <dt class="visually-hidden" data-i18n="app.drawer.stats.round"></dt>
          <dd id="drawer-mode" class="drawer-mode"></dd>
          <dd id="drawer-star-progress" class="drawer-star-progress gold-text"></dd>
        </div>
        <div class="drawer-stat">
          <dt data-i18n="hud.stats.coins.label"></dt>
          <dd id="drawer-coins" class="gold-text"></dd>
        </div>
        <div class="drawer-stat">
          <dt data-i18n="hud.stats.highScore.label"></dt>
          <dd id="drawer-best"></dd>
        </div>
        <div class="drawer-stat">
          <dt data-i18n="hud.stats.overcharge.label"></dt>
          <dd id="drawer-overcharge"></dd>
        </div>
        <div id="drawer-perks-stat" class="drawer-stat drawer-stat-wide hidden">
          <dt data-i18n="hud.stats.perks.label"></dt>
          <dd id="drawer-perks" class="perk-chips"></dd>
        </div>
      </dl>
      <button id="btn-play" type="button" data-closes-drawer class="nav-btn primary play-btn" aria-haspopup="dialog"><span class="play-btn-label" data-i18n="app.drawer.button.play"></span> <span id="play-new-badge" class="mode-new-badge hidden" aria-hidden="true" data-i18n="app.nav.locked.newBadge"></span></button>
      <button id="btn-stats" type="button" data-closes-drawer class="nav-btn stats-btn" aria-haspopup="dialog" data-i18n="app.drawer.button.stats"></button>
      <button id="btn-settings" type="button" data-closes-drawer class="nav-btn settings-btn" aria-haspopup="dialog"><span class="settings-btn-icon" aria-hidden="true" data-i18n="app.nav.button.settingsIcon"></span> <span data-i18n="app.nav.button.settings"></span></button>
      <nav class="nav-controls">
        <div class="nav-group nav-actions" role="group" aria-labelledby="nav-group-round-title">
          <span id="nav-group-round-title" class="nav-group-title" data-i18n="app.nav.groups.round"></span>
          <button id="btn-pause" type="button" data-closes-drawer class="nav-btn" data-i18n="app.nav.button.pause" data-i18n-title="app.nav.button.pauseTooltip"></button>
          <button id="btn-restart" type="button" data-closes-drawer class="nav-btn" data-i18n="app.nav.button.restart"></button>
          <button id="btn-shop" type="button" data-closes-drawer class="nav-btn gold" data-i18n="app.nav.button.shop"></button>
        </div>
      </nav>
    </header>

    <div id="drawer-backdrop" class="drawer-backdrop" aria-hidden="true"></div>

    <section class="hud-bar">
      <button id="btn-menu" type="button" class="hud-menu-btn" aria-controls="app-drawer" aria-expanded="false" data-i18n-aria-label="app.drawer.button.openAria" data-i18n-title="app.drawer.button.openAria"><span aria-hidden="true">☰</span></button>
      <div class="hud-stat-box hud-stat-score">
        <span class="hud-label" data-i18n="hud.stats.score.label"></span>
        <span id="hud-score-value" class="hud-value"></span>
        <span id="hud-star-progress" class="hud-subvalue gold-text"><span id="hud-star-glyphs" class="hud-subvalue-part" aria-hidden="true"></span><span id="hud-star-count" class="visually-hidden"></span> <span id="hud-star-next" class="hud-subvalue-part"></span><span id="hud-star-meter" class="star-meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" data-i18n-aria-label="hud.stats.score.progressAria"><span id="hud-star-meter-fill" class="star-meter-fill"></span></span></span>
      </div>
      <div class="hud-center-info">
        <div class="hud-mode-row">
          <div id="hud-mode-banner" class="hud-mode-banner" role="button" tabindex="0" aria-haspopup="dialog"></div>
          <button id="btn-hint-replay" type="button" class="hud-menu-btn hud-hint-btn hidden" data-i18n-aria-label="hud.hints.replayAria" data-i18n-title="hud.hints.replayAria"><span aria-hidden="true">?</span></button>
        </div>
        <div class="hud-badges-row">
          <span id="hud-combo-badge" class="hud-badge combo hidden"></span>
          <span id="hud-frozen-badge" class="hud-badge frozen hidden"></span>
          <span id="hud-best-run" class="hud-badge best-run hidden"></span>
          <span id="hud-ghost" class="hud-badge ghost hidden" role="group"></span>
          <span id="hud-magnetar-telegraph" class="hud-badge magnetar hidden" aria-hidden="true"></span>
          <span id="hud-perks" class="perk-chips hidden" role="group" data-i18n-aria-label="hud.stats.perks.label"></span>
        </div>
      </div>
      <div class="hud-stat-box hud-stat-shots">
        <span id="hud-shots-label" class="hud-label" data-i18n="hud.stats.shots.label"></span>
        <span id="hud-shots-value" class="hud-value highlight"></span>
        <span id="hud-sag-meter" class="sag-meter hidden" role="meter" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0" aria-valuetext="" data-i18n-aria-label="hud.stats.sag.label"><span id="hud-sag-meter-fill" class="sag-meter-fill"></span></span>
      </div>
      <div class="hud-stat-box hud-stat-coins">
        <span class="hud-label" data-i18n="hud.stats.coins.label"></span>
        <span id="hud-coins-value" class="hud-value gold-text"></span>
      </div>
      <div class="hud-stat-box hud-stat-best">
        <span class="hud-label" data-i18n="hud.stats.highScore.label"></span>
        <span id="hud-best-value" class="hud-value"></span>
      </div>
      <button id="btn-fullscreen-hud" type="button" class="hud-menu-btn hud-fullscreen-btn"></button>
      <p id="hud-compact-info" class="hud-compact-info"></p>
    </section>

    <main class="stage-container">
      <div class="stage-column">
        <div class="canvas-area">
          <div class="canvas-wrapper">
            <canvas id="game-canvas" role="application" tabindex="0"></canvas>
            <div id="tutorial-banner" class="tutorial-banner hidden" aria-live="polite">
              <span id="tutorial-banner-text"></span>
              <button id="btn-dismiss-tutorial" type="button" class="tutorial-dismiss-btn"><span aria-hidden="true">✕</span></button>
            </div>
            <div id="level-intro-banner" class="level-intro-banner hidden">
              <span id="level-intro-text"></span>
              <button id="btn-dismiss-level-intro" type="button" class="tutorial-dismiss-btn" data-i18n-aria-label="hud.levelIntro.dismiss"><span aria-hidden="true">✕</span></button>
            </div>
            <div id="special-equipped-banner" class="special-equipped-banner hidden" aria-live="polite"></div>
            <div id="cancel-aim-banner" class="cancel-aim-banner hidden" data-i18n="hud.launcher.cancel.hint"></div>
          </div>
        </div>
        <div class="launcher-controls-dock">
          <button id="btn-polarity" type="button" class="polarity-floating-btn"><span class="launcher-icon" aria-hidden="true"></span> <span class="launcher-text"></span><span class="launcher-caption" aria-hidden="true"></span><span class="pad-glyph pad-face" data-pos="top" aria-hidden="true"></span></button>
          <button id="btn-swap-ball" type="button" class="swap-floating-btn"><span class="launcher-icon" aria-hidden="true"></span> <span class="launcher-text"></span><span class="launcher-caption" aria-hidden="true"></span><span class="pad-glyph pad-face" data-pos="left" aria-hidden="true"></span></button>
        </div>
      </div>

      <aside class="powerups-panel">
        <div class="overcharge-widget">
          <div class="overcharge-header">
            <span data-i18n="hud.stats.overcharge.label"></span>
            <span id="hud-overcharge-pct"></span>
          </div>
          <div class="overcharge-track">
            <div id="hud-overcharge-fill" class="overcharge-fill"></div>
          </div>
        </div>
        <div id="powerups-header" class="powerups-header" data-i18n="hud.powerups.title.label"></div>
        <div id="powerups-bar" class="powerups-bar"></div>
        <p id="powerups-empty" class="powerups-empty hidden" data-i18n="hud.powerups.empty"></p>
      </aside>
    </main>
  </div>

  <div id="sr-announcer" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <div id="toast" class="toast hidden" aria-hidden="true"></div>

  <!-- Play hub: every mode in one window -->
  <div id="modal-play" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-play-title">
    <div class="modal-card wide play-hub">
      <div class="play-hub-header">
        <h2 id="modal-play-title" class="modal-title" data-i18n="modals.play.title"></h2>
        <button id="btn-close-play" type="button" class="modal-btn" data-i18n="modals.levelSelect.button.close"></button>
      </div>
      <p id="play-hub-hint" class="modal-subtext hidden" role="status" aria-live="polite"></p>
      <div class="play-hub-layout">
        <section class="play-hub-section play-hub-campaign" aria-labelledby="play-section-campaign-title">
          <h3 id="play-section-campaign-title" class="play-section-title"><span class="play-section-icon" aria-hidden="true" data-i18n="modals.play.icon.campaign"></span> <span data-i18n="modals.play.section.campaign"></span></h3>
          <p id="play-campaign-summary" class="play-campaign-summary"></p>
          <div id="play-campaign-meter" class="star-meter play-campaign-meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="play-campaign-summary"><span id="play-campaign-meter-fill" class="star-meter-fill"></span></div>
          <div class="play-hub-campaign-actions">
            <button id="btn-campaign-continue" type="button" class="modal-btn primary"></button>
            <button id="btn-campaign-map" type="button" class="modal-btn" aria-haspopup="dialog" data-i18n="modals.play.campaign.map"></button>
          </div>
        </section>
        <section class="play-hub-section play-hub-challenges" aria-labelledby="play-section-challenges-title">
          <h3 id="play-section-challenges-title" class="play-section-title" data-i18n="modals.play.section.challenges"></h3>
          <div class="play-hub-grid">
            <button id="btn-daily" type="button" class="arcade-mode-card">
              <span class="arcade-card-icon" aria-hidden="true" data-i18n="modals.play.icon.daily"></span>
              <span class="arcade-card-title" data-i18n="app.nav.button.daily"></span>
              <span class="arcade-card-desc" data-i18n="modals.play.daily.desc"></span>
              <span id="daily-reward" class="arcade-card-best gold-text hidden"></span>
            </button>
            <button id="btn-weekly" type="button" class="arcade-mode-card">
              <span class="arcade-card-icon" aria-hidden="true" data-i18n="modals.play.icon.weekly"></span>
              <span class="arcade-card-title" data-i18n="app.nav.button.weekly"></span>
              <span class="arcade-card-desc" data-i18n="modals.play.weekly.desc"></span>
              <span id="weekly-reward" class="arcade-card-best gold-text hidden"></span>
            </button>
          </div>
        </section>
        <section class="play-hub-section play-hub-arcade" aria-labelledby="play-section-arcade-title">
          <h3 id="play-section-arcade-title" class="play-section-title" data-i18n="modals.play.section.arcade"></h3>
          <div class="play-hub-grid">
            <button id="btn-endless" type="button" class="arcade-mode-card">
                <span class="arcade-card-icon" aria-hidden="true" data-i18n="modals.play.icon.endless"></span>
                <span class="arcade-card-title" data-i18n="app.nav.button.endless"></span>
                <span class="arcade-card-desc" data-i18n="modals.play.arcade.endlessDesc"></span>
                <span id="arcade-best-endless" class="arcade-card-best gold-text"></span>
              </button>
            <button id="btn-mode-classic" type="button" class="arcade-mode-card">
                <span class="arcade-card-icon" aria-hidden="true" data-i18n="modals.play.icon.classic"></span>
                <span class="arcade-card-title" data-i18n="modals.levelSelect.arcade.classic"></span>
                <span class="arcade-card-desc" data-i18n="modals.levelSelect.arcade.classicDesc"></span>
                <span id="arcade-best-classic" class="arcade-card-best gold-text"></span>
              </button>
            <div class="play-hub-cell">
              <button id="btn-mode-puzzle" type="button" class="arcade-mode-card">
                <span class="arcade-card-icon" aria-hidden="true" data-i18n="modals.play.icon.puzzle"></span>
                <span class="arcade-card-title" data-i18n="modals.levelSelect.arcade.puzzle"></span>
                <span class="arcade-card-desc" data-i18n="modals.levelSelect.arcade.puzzleDesc"></span>
                <span id="arcade-best-puzzle" class="arcade-card-best gold-text"></span>
              </button>
              <button id="btn-puzzle-stages-toggle" type="button" class="nav-btn badge-btn arcade-card-toggle" aria-expanded="false" aria-controls="puzzle-stages-strip" data-i18n="modals.play.puzzle.stagesToggle"></button>
            </div>
            <button id="btn-mode-blitz" type="button" class="arcade-mode-card">
                <span class="arcade-card-icon" aria-hidden="true" data-i18n="modals.play.icon.blitz"></span>
                <span class="arcade-card-title" data-i18n="modals.levelSelect.arcade.blitz"></span>
                <span class="arcade-card-desc" data-i18n="modals.levelSelect.arcade.blitzDesc"></span>
                <span id="arcade-best-blitz" class="arcade-card-best gold-text"></span>
              </button>
            <div class="play-hub-cell">
              <button id="btn-flux" type="button" class="arcade-mode-card">
                <span class="arcade-card-icon" aria-hidden="true" data-i18n="modals.play.icon.flux"></span>
                <span class="arcade-card-title" data-i18n="app.nav.button.flux"></span>
                <span class="arcade-card-desc" data-i18n="modals.play.arcade.fluxDesc"></span>
                <span id="arcade-best-flux" class="arcade-card-best gold-text"></span>
              </button>
              <button id="btn-flux-seed-toggle" type="button" class="nav-btn badge-btn arcade-card-toggle" aria-expanded="false" aria-controls="flux-seed-entry" data-i18n="modals.play.flux.seedToggle"></button>
            </div>
            <button id="btn-mode-cascade" type="button" class="arcade-mode-card">
                <span class="arcade-card-icon" aria-hidden="true" data-i18n="modals.play.icon.cascade"></span>
                <span class="arcade-card-title" data-i18n="modals.levelSelect.arcade.cascade"></span>
                <span class="arcade-card-desc" data-i18n="modals.levelSelect.arcade.cascadeDesc"></span>
                <span id="arcade-best-cascade" class="arcade-card-best gold-text"></span>
              </button>
            <button id="btn-mode-boss-rush" type="button" class="arcade-mode-card">
                <span class="arcade-card-icon" aria-hidden="true" data-i18n="modals.play.icon.bossRush"></span>
                <span class="arcade-card-title" data-i18n="modals.levelSelect.arcade.bossRush"></span>
                <span class="arcade-card-desc" data-i18n="modals.levelSelect.arcade.bossRushDesc"></span>
                <span id="arcade-best-boss-rush" class="arcade-card-best gold-text"></span>
              </button>
          </div>
          <div id="puzzle-stages-strip" class="puzzle-stages-strip play-disclosure hidden" role="group" data-i18n-aria-label="modals.play.puzzle.stagesToggle"></div>
          <div id="flux-seed-entry" class="flux-seed-entry play-disclosure hidden">
            <input id="input-flux-seed" type="text" class="flux-seed-input" autocomplete="off" spellcheck="false" data-i18n-placeholder="modals.levelSelect.fluxSeed.placeholder" data-i18n-aria-label="modals.levelSelect.fluxSeed.ariaLabel">
            <button id="btn-flux-seed-go" type="button" class="nav-btn badge-btn" data-i18n="modals.levelSelect.fluxSeed.launch"></button>
          </div>
        </section>
        <section class="play-hub-section play-hub-duel" aria-labelledby="play-section-duel-title">
          <h3 id="play-section-duel-title" class="play-section-title" data-i18n="modals.play.section.duel"></h3>
          <div class="play-hub-grid">
            <button id="btn-mode-versus" type="button" class="arcade-mode-card" aria-haspopup="dialog">
                <span class="arcade-card-icon" aria-hidden="true" data-i18n="modals.play.icon.versus"></span>
                <span class="arcade-card-title" data-i18n="versus.card.title"></span>
                <span class="arcade-card-desc" data-i18n="versus.card.description"></span>
                <span id="arcade-best-versus" class="arcade-card-best gold-text"></span>
              </button>
              <button id="btn-versus-local-hub" type="button" class="modal-btn hidden" aria-haspopup="dialog" data-i18n="versus.local.entry"></button>
              <p id="versus-local-hub-hint" class="modal-subtext hidden" data-i18n="versus.local.entryHint"></p>
          </div>
        </section>
      </div>
    </div>
  </div>

  <!-- Campaign map: chapter switcher, level tiles and the detail of the selected level -->
  <div id="modal-levels" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-levels-title">
    <div class="modal-card wide levels-map">
      <div class="levels-map-header">
        <h2 id="modal-levels-title" class="modal-title" data-i18n="modals.levelSelect.title.main"></h2>
        <button id="btn-close-levels" type="button" class="modal-btn" data-i18n="modals.levelSelect.button.close"></button>
      </div>
      <p id="levels-stars-summary" class="modal-stat-line gold-text"></p>
      <div class="levels-switcher">
        <button id="btn-chapter-prev" type="button" class="nav-btn badge-btn levels-switcher-btn" data-pad-tab-prev data-i18n-aria-label="modals.levelSelect.chapters.prev" data-i18n-title="modals.levelSelect.chapters.prev"><span aria-hidden="true">&lt;</span></button>
        <select id="levels-chapter-select" class="levels-chapter-select" data-i18n-aria-label="modals.levelSelect.chapters.label"></select>
        <button id="btn-chapter-next" type="button" class="nav-btn badge-btn levels-switcher-btn" data-pad-tab-next data-i18n-aria-label="modals.levelSelect.chapters.next" data-i18n-title="modals.levelSelect.chapters.next"><span aria-hidden="true">&gt;</span></button>
      </div>
      <div class="levels-chapter-summary">
        <p id="levels-chapter-progress" class="modal-stat-line gold-text"></p>
        <div class="star-meter levels-chapter-meter" aria-hidden="true"><span id="levels-chapter-meter-fill" class="star-meter-fill"></span></div>
      </div>
      <div class="levels-toolbar">
        <button id="btn-levels-filter-incomplete" type="button" class="nav-btn badge-btn" aria-pressed="false" data-i18n="modals.levelSelect.filter.incomplete"></button>
        <button id="btn-levels-jump-current" type="button" class="nav-btn badge-btn" data-i18n="modals.levelSelect.jumpCurrent"></button>
      </div>
      <p id="levels-chapter-hint" class="modal-subtext hidden" role="status" aria-live="polite"></p>
      <div class="levels-map-body">
        <div id="levels-grid" class="levels-grid level-tiles" role="listbox"></div>
        <aside id="levels-detail" class="levels-detail" aria-labelledby="levels-detail-title">
          <p id="levels-detail-header" class="levels-detail-header"></p>
          <h3 id="levels-detail-title" class="levels-detail-title"></h3>
          <span id="levels-detail-badge" class="level-format-badge hidden"></span>
          <p id="levels-detail-desc" class="levels-detail-desc"></p>
          <p id="levels-detail-stars" class="levels-detail-stars"></p>
          <p id="levels-detail-best" class="levels-detail-best"></p>
          <p id="levels-detail-lock" class="levels-detail-lock hidden"></p>
          <button id="btn-play-level-modal" type="button" class="modal-btn primary"></button>
        </aside>
      </div>
    </div>
  </div>

  <!-- Polarity Duel: difficulty picker, stacked over the level select -->
  <div id="modal-versus-tiers" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-versus-tiers-title" aria-describedby="versus-tiers-subtitle versus-tiers-rules">
    <div class="modal-card">
      <h2 id="modal-versus-tiers-title" class="modal-title" data-i18n="versus.lobby.title"></h2>
      <p id="versus-tiers-subtitle" class="modal-subtext" data-i18n="versus.lobby.subtitle"></p>
      <p id="versus-tiers-rules" class="modal-subtext" data-i18n="versus.lobby.rules"></p>
      <div id="versus-tier-list" class="versus-tier-list" role="group" data-i18n-aria-label="versus.lobby.pickTier">
      </div>
      <label class="settings-controller-field versus-setup-option">
        <input id="input-versus-resonance" type="checkbox">
        <span data-i18n="versus.setup.resonance"></span>
      </label>
      <p id="versus-tier-hint" class="modal-subtext hidden" role="status" aria-live="polite"></p>

      </label>
      <div class="modal-actions">
        <button id="btn-copy-stats" type="button" class="modal-btn primary" data-i18n="modals.stats.button.copy"></button>
        <button id="btn-close-stats" type="button" class="modal-btn" data-i18n="modals.stats.button.close"></button>
      </div>
    </div>
  </div>

  <!-- Ghost Duel card: a challenge link, or why it cannot be played -->
  <div id="modal-duel" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-duel-title" aria-describedby="duel-card-summary">
    <div class="modal-card">
      <h2 id="modal-duel-title" class="modal-title" data-i18n="duel.card.title"></h2>
      <p id="duel-card-summary" class="modal-stat-line"></p>
      <ul id="duel-card-notes" class="duel-card-notes hidden"></ul>
      <div class="modal-actions">
        <button id="btn-duel-accept" type="button" class="modal-btn primary" data-i18n="duel.card.accept"></button>
        <button id="btn-duel-decline" type="button" class="modal-btn" data-i18n="duel.card.decline"></button>
        <button id="btn-duel-ok" type="button" class="modal-btn primary hidden" data-i18n="duel.error.ok"></button>
      </div>
    </div>
  </div>

  <!-- Confirm Action Modal -->
  <div id="modal-confirm" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-confirm-title">
    <div class="modal-card">
      <h2 id="modal-confirm-title" class="modal-title" data-i18n="modals.confirm.title.main"></h2>
      <p id="modal-confirm-message" class="modal-stat-line muted" data-i18n="modals.confirm.message"></p>
      <div class="modal-actions">
        <button id="btn-confirm-yes" type="button" class="modal-btn danger" data-i18n="modals.confirm.button.confirm"></button>
        <button id="btn-confirm-no" type="button" class="modal-btn primary" data-i18n="modals.confirm.button.cancel"></button>
      </div>
    </div>
  </div>

  <!-- Polarity Duel screen: a layer of its own, the app shell is inert while it is open -->
  <div id="versus-screen" class="versus-screen hidden" role="group" aria-labelledby="versus-screen-title" data-layout="split">
    <h2 id="versus-screen-title" class="visually-hidden" data-i18n="versus.mode.name"></h2>
    <header class="versus-bar">
      <div id="versus-round-pips" class="versus-round-pips" role="img">
        <span id="versus-round-label" class="versus-round-label" aria-hidden="true"></span>
        <span id="versus-pips-player" class="versus-pip-group" aria-hidden="true" data-side="player"></span>
        <span id="versus-pips-cpu" class="versus-pip-group" aria-hidden="true" data-side="cpu"></span>
      </div>
      <span id="versus-sudden-death" class="versus-sudden-death hidden" data-i18n="versus.bar.suddenDeath"></span>
      <span id="versus-timer" class="versus-timer" role="timer"></span>
      <button id="btn-versus-pause" type="button" class="nav-btn" data-i18n="versus.bar.pause"></button>
    </header>
    <div class="versus-boards">
      <section class="versus-board" data-board="0">
        <div id="versus-hud-0" class="versus-hud" role="group">
          <span class="versus-badge hidden" data-slot="0" aria-hidden="true"></span>
          <span class="versus-hud-label"></span>
          <span class="versus-incoming"></span>
          <span class="versus-pulse" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="versus-pulse-fill"></span></span>
          <div class="versus-hud-actions">
            <button id="btn-versus-polarity" type="button" class="versus-action-btn" aria-pressed="false"></button>
            <button id="btn-versus-swap" type="button" class="versus-action-btn"></button>
          </div>
          <div id="versus-specials" class="versus-specials hidden" role="group"></div>
        </div>
        <div class="versus-canvas-wrap"><canvas id="versus-canvas-0" role="application" tabindex="0"></canvas></div>
      </section>
      <section class="versus-board" data-board="1">
        <div id="versus-hud-1" class="versus-hud" role="group">
          <span class="versus-badge hidden" data-slot="1" aria-hidden="true"></span>
          <span class="versus-hud-label"></span>
          <span class="versus-incoming"></span>
          <span class="versus-pulse" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="versus-pulse-fill"></span></span>
          <div class="versus-hud-actions versus-hud-actions-local">
            <button id="btn-versus-polarity-1" type="button" class="versus-action-btn" aria-pressed="false"></button>
            <button id="btn-versus-swap-1" type="button" class="versus-action-btn"></button>
          </div>
          <div id="versus-specials-1" class="versus-specials hidden" role="group"></div>
        </div>
        <div class="versus-canvas-wrap"><canvas id="versus-canvas-1" role="img"></canvas></div>
      </section>
    </div>
    <div id="versus-round-overlay" class="versus-round-overlay hidden" aria-hidden="true"></div>
  </div>

  <!-- Polarity Duel pause -->
  <div id="modal-duel-pause" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-duel-pause-title">
    <div class="modal-card">
      <h2 id="modal-duel-pause-title" class="modal-title" data-i18n="versus.pause.title"></h2>
      <p id="versus-pause-size-hint" class="modal-subtext hidden" role="status"></p>
      <p id="versus-pause-pad-hint" class="modal-subtext hidden" role="status"></p>
      <div class="modal-actions">
        <button id="btn-versus-resume" type="button" class="modal-btn primary" data-i18n="versus.pause.resume"></button>
        <button id="btn-versus-restart" type="button" class="modal-btn" data-i18n="versus.pause.restart"></button>
        <button id="btn-versus-quit" type="button" class="modal-btn danger" data-i18n="versus.pause.quit"></button>
      </div>
    </div>
  </div>

  <!-- Polarity Duel match result -->
  <div id="modal-duel-result" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-duel-result-title" aria-describedby="versus-result-score">
    <div class="modal-card">
      <h2 id="modal-duel-result-title" class="modal-title"></h2>
      <p id="versus-result-score" class="modal-stat-line gold-text"></p>
      <p id="versus-result-tier" class="modal-stat-line"></p>
      <p id="versus-result-neutralised" class="modal-stat-line"></p>
      <p id="versus-result-pulses" class="modal-stat-line"></p>
      <p id="versus-result-neutralised-b" class="modal-stat-line hidden"></p>
      <p id="versus-result-pulses-b" class="modal-stat-line hidden"></p>
      <label id="versus-result-share-fallback" class="share-fallback hidden">
        <span class="share-fallback-label" data-i18n="modals.gameOver.share.field.label"></span>
        <textarea id="versus-result-share-text" class="share-fallback-text" readonly></textarea>
      </label>
      <div class="modal-actions">
        <button id="btn-versus-rematch" type="button" class="modal-btn primary" data-i18n="versus.result.playAgain"></button>
        <button id="btn-versus-share" type="button" class="modal-btn" data-i18n="modals.gameOver.button.share"></button>
        <button id="btn-versus-change-players" type="button" class="modal-btn hidden" data-i18n="versus.local.result.changePlayers"></button>
        <button id="btn-versus-back" type="button" class="modal-btn" data-i18n="versus.result.backToMenu"></button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>

  <!-- Bootstrap error banner: static bilingual text because i18n may be the failing part -->
  <div id="bootstrap-error" class="bootstrap-error hidden" role="alert">
    <strong class="bootstrap-error-title">Erreur de chargement / Loading error</strong>
    <p class="bootstrap-error-message" lang="fr">Une erreur empêche le jeu de fonctionner. Veuillez rafraîchir la page.</p>
    <p class="bootstrap-error-message" lang="en">An error prevents the game from running. Please refresh the page.</p>
  </div>
</body>
</html>
